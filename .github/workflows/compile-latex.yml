name: Compile LaTeX Thesis
on: [push]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          # Path to your main tex file
          root_file: Bachelor_Thesis_Group8.tex
          # The directory where the tex file lives
          working_directory: "Bachelor report/admin and thesis/Bachelor thesis/"
          # Important for glossaries and bibliographies
          latexmk_use_lualatex: false
          args: "-pdf -file-line-error -halt-on-error -interaction=nonstopmode"

      - name: Upload PDF result
        uses: actions/upload-artifact@v4
        with:
          name: Thesis-PDF
          path: "Bachelor report/admin and thesis/Bachelor thesis/Bachelor_Thesis_Group8.pdf"